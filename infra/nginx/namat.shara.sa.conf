# NAMAT — isolated vhost for namat.shara.sa only
# Upstream binds: 127.0.0.1:3300 web / 127.0.0.1:3302 api
# Do not modify sibling product vhosts.

map $http_upgrade $connection_upgrade_namat {
    default upgrade;
    ''      close;
}

upstream namat_web {
    server 127.0.0.1:3300;
    keepalive 16;
}

upstream namat_api {
    server 127.0.0.1:3302;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name namat.shara.sa;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name namat.shara.sa;

    # Certbot will replace these paths after issue; placeholders until DNS exists:
    # ssl_certificate /etc/letsencrypt/live/namat.shara.sa/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/namat.shara.sa/privkey.pem;
    # Until certs exist, keep this server disabled or use a temporary self-signed cert.

    client_max_body_size 25m;

    location ~* ^/(metrics|internal|debug|actuator) {
        return 404;
    }

    location /api/ {
        proxy_pass http://namat_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://namat_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://namat_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://namat_api/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://namat_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_namat;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
