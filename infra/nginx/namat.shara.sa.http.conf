# NAMAT — HTTP bootstrap vhost (pre-TLS)
# Enable only after DNS A/AAAA for namat.shara.sa points to this host.
# After certbot, replace with namat.shara.sa.conf (TLS) or let certbot amend this file.

map $http_upgrade $connection_upgrade_namat {
    default upgrade;
    ''      close;
}

upstream namat_web {
    server 127.0.0.1:3300;
    keepalive 16;
}

upstream namat_api {
    server 127.0.0.1:3302;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name namat.shara.sa;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~* ^/(metrics|internal|debug|actuator) {
        return 404;
    }

    location /api/ {
        proxy_pass http://namat_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://namat_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://namat_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://namat_api/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://namat_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_namat;
        proxy_buffering off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
