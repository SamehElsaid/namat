[package]
name = "airlift-read"
version = "0.1.0"
edition = "2021"
description = "Export-read-restore state machine for Wallet artwork backup. No device I/O and no network."
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
futures = "0.3"
