name: Namat
options:
  bundleIdPrefix: sa.shara.namat
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0
  WalletSkinEngine:
    path: ../../prototypes/wallet-engine
targets:
  Namat:
    type: application
    platform: iOS
    sources:
      - path: Sources/NamatApp
      - path: Sources/NamatCore
      - path: Sources/NamatUI
      - path: Resources
    # XcodeGen rewrites Info.plist from these properties on every generate.
    # Keys that exist only in the committed plist are deleted before the build.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NAMAT
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NamatAPIBaseURL: https://namat.shara.sa/api/v1
        GIDClientID: 588751829801-o1l3gdt9fcquhn4ncq5kgig10c7fb0tq.apps.googleusercontent.com
        GIDServerClientID: 588751829801-hncn7v533cpfbbhj6f6nodi7emk92spf.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.588751829801-o1l3gdt9fcquhn4ncq5kgig10c7fb0tq
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        NSLocalNetworkUsageDescription: "نَمَط يحتاج الشبكة المحلية لإعداد هذا الآيفون. NAMAT uses the local network to set up this iPhone."
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: WalletSkinEngine
        product: WalletSkinEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.shara.namat.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: NAMAT
        INFOPLIST_KEY_NamatAPIBaseURL: https://namat.shara.sa/api/v1
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # AirliftFFI is the package binary target when Vendor/AirliftFFI.xcframework
        # exists. Do not link that static archive a second time from this target.
        OTHER_LDFLAGS: "-lc++"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
schemes:
  Namat:
    build:
      targets:
        Namat: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
